<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | Расписание</title>
  <meta name="theme-color" content="#4F46E5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-1: #EEF0FB;
      --bg-2: #E3E7FB;
      --surface: #FFFFFF;
      --border: #E4E7F5;
      --ink: #1B1E2E;
      --ink-soft: #6B7086;
      --ink-faint: #9CA0B4;
      --primary: #4F46E5;
      --primary-light: #EEF0FF;
      --primary-dark: #3730A3;
      --accent: #F9734F;
      --accent-light: #FFEEE8;
      --success: #1FAE6B;
      --success-light: #E7F9EF;
      --warning: #E8A317;
      --warning-light: #FFF6E0;
      --danger: #E23D48;
      --danger-light: #FDE8E9;
    }

    [data-theme="dark"] {
      --bg-1: #0F1419;
      --bg-2: #1A1F2E;
      --surface: #1E2330;
      --border: #2C3142;
      --ink: #F5F7FA;
      --ink-soft: #A8B0C0;
      --ink-faint: #7A8296;
      --primary: #6B5FFF;
      --primary-light: #2A2550;
      --primary-dark: #8B7FFF;
      --accent: #FF8A65;
      --accent-light: #4A2A20;
      --success: #2FD68B;
      --success-light: #1F4A35;
      --warning: #FFB74D;
      --warning-light: #4A3820;
      --danger: #FF6B6B;
      --danger-light: #4A2020;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(1100px 500px at 85% -10%, #E9E1FF 0%, transparent 60%),
        radial-gradient(900px 500px at -10% 10%, #DCEBFF 0%, transparent 55%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2) 60%);
      background-attachment: fixed;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: background 0.3s ease, color 0.3s ease;
    }

    [data-theme="dark"] body {
      background:
        radial-gradient(1100px 500px at 85% -10%, #2A2555 0%, transparent 60%),
        radial-gradient(900px 500px at -10% 10%, #1C2A5C 0%, transparent 55%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2) 60%);
    }

    .theme-toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink-soft);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      font-size: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .theme-toggle-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 4px 10px rgba(20, 22, 50, 0.06), 0 16px 32px -14px rgba(20, 22, 50, 0.18);
      border: 1px solid var(--border);
      transition: background 0.3s ease, border 0.3s ease;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #8B5CF6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 6px 16px -6px rgba(79, 70, 229, 0.55);
    }

    .login-logo svg {
      width: 32px;
      height: 32px;
      stroke: white;
      fill: none;
      stroke-width: 2;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .login-header p {
      font-size: 14px;
      color: var(--ink-soft);
    }

    .tab-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 24px;
      padding: 4px;
      background: var(--bg-1);
      border-radius: 12px;
    }

    .tab-btn {
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.15s ease;
      font-family: 'Inter', sans-serif;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(20, 22, 50, 0.04), 0 8px 24px -12px rgba(20, 22, 50, 0.12);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      background: var(--bg-1);
      color: var(--ink);
      transition: all 0.15s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .form-actions input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .form-actions label {
      font-size: 13px;
      color: var(--ink-soft);
      cursor: pointer;
      margin: 0;
    }

    .forgot-password {
      text-align: right;
      margin-bottom: 16px;
    }

    .forgot-password a {
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .forgot-password a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--primary), #8B5CF6);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .hidden {
      display: none;
    }

    .error-message {
      background: var(--danger-light);
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      border: 1px solid var(--danger);
    }

    .success-message {
      background: var(--success-light);
      color: var(--success);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      border: 1px solid var(--success);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--ink-faint);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .demo-credentials {
      background: var(--primary-light);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 12px;
      color: var(--primary-dark);
      margin-top: 16px;
      text-align: center;
    }

    .demo-credentials strong {
      display: block;
      margin-bottom: 4px;
    }
  </style>
  </style>
</head>
<body>

<button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" title="Переключить тему">
  <span id="theme-icon">🌙</span>
</button>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="3"/>
          <path d="M8 3v4M16 3v4M3 10h18"/>
        </svg>
      </div>
      <h1>Умное расписание</h1>
      <p id="tab-subtitle">Войди в свой аккаунт</p>
    </div>

    <div class="tab-selector">
      <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
      <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
    </div>

    <!-- TAB: ЛОГИН -->
    <div id="login-tab">
      <div id="login-error" class="error-message hidden"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Логин</label>
          <input type="text" id="login-username" placeholder="Введи логин" required>
        </div>

        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="login-password" placeholder="Введи пароль" required>
        </div>

        <div class="form-actions">
          <input type="checkbox" id="login-remember" checked>
          <label for="login-remember">Запомнить меня</label>
        </div>

        <button type="submit" class="submit-btn">Войти</button>
      </form>
    </div>

    <!-- TAB: РЕГИСТРАЦИЯ -->
    <div id="register-tab" class="hidden">
      <div id="register-error" class="error-message hidden"></div>
      <div id="register-success" class="success-message hidden"></div>

      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Логин</label>
          <input type="text" id="register-username" placeholder="Придумай логин" required>
        </div>

        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="register-password" placeholder="Минимум 6 символов" required minlength="6">
        </div>

        <div class="form-group">
          <label>Подтверди пароль</label>
          <input type="password" id="register-password-confirm" placeholder="Повтори пароль" required minlength="6">
        </div>

        <button type="submit" class="submit-btn">Зарегистрироваться</button>
      </form>

      <div class="demo-credentials">
        <strong>ℹ️ Информация:</strong>
        Данные хранятся локально на твоем устройстве
      </div>
    </div>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
