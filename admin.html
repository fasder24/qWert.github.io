<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель | Расписание</title>
  <meta name="theme-color" content="#F9734F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border);
    }
    .admin-header h1 {
      margin: 0;
      font-size: 28px;
      color: var(--accent);
    }
    .admin-back-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
      text-decoration: none;
      color: var(--ink);
      display: inline-block;
    }
    .admin-back-btn:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }
    .admin-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-soft);
    }
    .admin-card h3 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: var(--primary);
    }
    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .stat-item:last-child {
      border-bottom: none;
    }
    .stat-label {
      font-size: 14px;
      color: var(--ink-soft);
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }
    .admin-actions {
      display: grid;
      gap: 12px;
    }
    .admin-action-btn {
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--primary), #8B5CF6);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s ease;
    }
    .admin-action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
    }
    .admin-action-btn.danger {
      background: linear-gradient(135deg, var(--accent), #FF6B35);
    }
    .admin-action-btn.danger:hover {
      box-shadow: 0 8px 16px rgba(249, 115, 79, 0.3);
    }
    .logs-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-soft);
    }
    .logs-container h3 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: var(--primary);
    }
    .logs-list {
      max-height: 400px;
      overflow-y: auto;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      background: var(--bg-1);
      border-radius: var(--radius-md);
      padding: 12px;
      color: var(--ink-faint);
    }
    .logs-list .log-item {
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
    }
    .logs-list .log-item:last-child {
      border-bottom: none;
    }
    .logs-list .log-time {
      color: var(--primary);
    }
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: var(--shadow-hover);
    }
    .login-card h1 {
      text-align: center;
      margin: 0 0 8px 0;
      font-size: 24px;
    }
    .login-card p {
      text-align: center;
      color: var(--ink-soft);
      margin: 0 0 24px 0;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .login-form input {
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      background: var(--bg-1);
    }
    .login-form input:focus {
      outline: 2px solid var(--primary);
      border-color: var(--primary);
    }
    .login-form button {
      padding: 12px;
      background: linear-gradient(135deg, var(--primary), #8B5CF6);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s ease;
    }
    .login-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
    }
  </style>
  <script>
    // Инициализация темы
    const savedTheme = localStorage.getItem('app-theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    
    // Проверка авторизации и прав админа
    const user = sessionStorage.getItem('current-user') || localStorage.getItem('current-user');
    if (!user) {
      window.location.href = 'login.html';
    } else {
      const userData = JSON.parse(user);
      if (!userData.isAdmin) {
        window.location.href = 'index.html';
      }
    }
  </script>
</head>
<body>
  <div class="admin-container" id="admin-app">
    <!-- Будет заполнено JavaScript -->
  </div>

  <script src="admin.js"></script>
</body>
</html>
